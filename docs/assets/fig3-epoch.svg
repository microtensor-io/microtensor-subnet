<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Figure 3: one epoch with two freezes, by role">
  <defs>
    <style>
      .s { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .c1 { font-size: 14px; font-weight: 600; fill: #eef0f5; }
      .c2 { font-size: 12.5px; fill: #8b93a1; }
      .lane { font-size: 15px; font-weight: 600; }
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="598" rx="18" fill="#0f1116" stroke="#262b36"/>
  <text x="48" y="58" class="m" font-size="14" fill="#8b95ff">FIGURE 3</text>
  <text x="48" y="90" class="s" font-size="24" font-weight="600" fill="#f2f4f8">One epoch: two freezes separate what each party can see</text>

  <!-- phase bar -->
  <rect x="200" y="122" width="190" height="40" rx="8" fill="#1b2033"/>
  <rect x="394" y="122" width="324" height="40" rx="8" fill="#151a33"/>
  <rect x="722" y="122" width="266" height="40" rx="8" fill="#1b2033"/>
  <rect x="992" y="122" width="168" height="40" rx="8" fill="#151a33"/>
  <text x="295" y="147" class="s" font-size="14" font-weight="600" fill="#c7cbff" text-anchor="middle">Commit window</text>
  <text x="556" y="147" class="s" font-size="14" font-weight="600" fill="#c7cbff" text-anchor="middle">Evaluation window</text>
  <text x="855" y="147" class="s" font-size="14" font-weight="600" fill="#c7cbff" text-anchor="middle">Grading</text>
  <text x="1076" y="147" class="s" font-size="14" font-weight="600" fill="#c7cbff" text-anchor="middle">Weights</text>

  <!-- freezes -->
  <path d="M392 112 V500" stroke="#f5b544" stroke-width="2" stroke-dasharray="6 6"/>
  <path d="M720 112 V500" stroke="#f5b544" stroke-width="2" stroke-dasharray="6 6"/>
  <rect x="352" y="508" width="80" height="26" rx="13" fill="#2a2110" stroke="#f5b544"/>
  <text x="392" y="526" class="m" font-size="12.5" fill="#f5b544" text-anchor="middle">FREEZE 1</text>
  <rect x="680" y="508" width="80" height="26" rx="13" fill="#2a2110" stroke="#f5b544"/>
  <text x="720" y="526" class="m" font-size="12.5" fill="#f5b544" text-anchor="middle">FREEZE 2</text>

  <!-- lanes -->
  <rect x="32" y="182" width="1136" height="96" rx="10" fill="#13161d"/>
  <rect x="32" y="290" width="1136" height="96" rx="10" fill="#13161d"/>
  <rect x="32" y="398" width="1136" height="96" rx="10" fill="#13161d"/>
  <text x="50" y="226" class="s lane" fill="#c0c6d2">Owner</text>
  <text x="50" y="246" class="s" font-size="12.5" fill="#6f7685">publishes, stores,</text>
  <text x="50" y="262" class="s" font-size="12.5" fill="#6f7685">signs; never scores</text>
  <text x="50" y="334" class="s lane" fill="#34d399">Miners</text>
  <text x="50" y="354" class="s" font-size="12.5" fill="#6f7685">run their own</text>
  <text x="50" y="370" class="s" font-size="12.5" fill="#6f7685">evaluation on GPU</text>
  <text x="50" y="442" class="s lane" fill="#8b95ff">Validators</text>
  <text x="50" y="462" class="s" font-size="12.5" fill="#6f7685">verify, grade and</text>
  <text x="50" y="478" class="s" font-size="12.5" fill="#6f7685">set weights</text>

  <!-- owner chips -->
  <g>
    <rect x="206" y="198" width="178" height="64" rx="10" fill="#1a1d25" stroke="#3a4150"/>
    <text x="220" y="225" class="s c1">Signed arena</text>
    <text x="220" y="246" class="s c2">task, base model, grader</text>
    <rect x="400" y="198" width="150" height="64" rx="10" fill="#1a1d25" stroke="#3a4150"/>
    <text x="414" y="225" class="s c1">Mirror weights</text>
    <text x="414" y="246" class="s c2">by sha256</text>
    <rect x="560" y="198" width="152" height="64" rx="10" fill="#1a1d25" stroke="#3a4150"/>
    <text x="574" y="225" class="s c1">Release inputs</text>
    <text x="574" y="246" class="s c2">items and seeds</text>
    <rect x="728" y="198" width="126" height="64" rx="10" fill="#1a1d25" stroke="#3a4150"/>
    <text x="740" y="225" class="s c1">Seal receipts</text>
    <text x="740" y="246" class="s c2">root on chain</text>
    <rect x="860" y="198" width="124" height="64" rx="10" fill="#1a1d25" stroke="#3a4150"/>
    <text x="872" y="225" class="s c1">Release labels</text>
    <text x="872" y="246" class="s c2">and probes</text>
  </g>

  <!-- miner chips -->
  <g>
    <rect x="206" y="306" width="178" height="64" rx="10" fill="#10261e" stroke="#2c6b52"/>
    <text x="220" y="333" class="s c1">Commit revision</text>
    <text x="220" y="354" class="s c2">weights digest, GPU profile</text>
    <rect x="400" y="306" width="312" height="64" rx="10" fill="#10261e" stroke="#2c6b52"/>
    <text x="414" y="333" class="s c1">Run every pool in the pinned image</text>
    <text x="414" y="354" class="s c2">record every call, upload a signed transcript</text>
  </g>

  <!-- validator chips -->
  <g>
    <rect x="728" y="414" width="126" height="64" rx="10" fill="#151a33" stroke="#3b4399"/>
    <text x="740" y="441" class="s c1">Replay on CPU</text>
    <text x="740" y="462" class="s c2">every miner, item</text>
    <rect x="860" y="414" width="124" height="64" rx="10" fill="#151a33" stroke="#3b4399"/>
    <text x="872" y="441" class="s c1">Spot check</text>
    <text x="872" y="462" class="s c2">200+ calls, GPU</text>
    <rect x="998" y="414" width="160" height="64" rx="10" fill="#151a33" stroke="#3b4399"/>
    <text x="1012" y="441" class="s c1">Grade and sign</text>
    <text x="1012" y="462" class="s c2">set weights on chain</text>
  </g>

  <text x="48" y="566" class="s" font-size="14" fill="#a7adbb">Items reach miners only after Freeze 1, and labels reach validators only after Freeze 2.</text>
  <text x="48" y="588" class="s" font-size="13" fill="#6f7685">ctx_compress: epoch 50,400 blocks (about 7 days), commit window 7,200 blocks (about 24 hours).</text>
</svg>
