name: release

on:
  push:
    tags:
      - "v*.*.*"
      - "prerelease-v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install ".[validator,dev]" build

      - name: Nothing is published unless the checks pass
        run: |
          ruff check .
          mypy microtensor
          if [ -d tests ]; then
            pytest tests -q
          else
            echo "::warning::the suite is not published here; run it before tagging"
          fi
          mt validator loopback --rounds 2 --miners 3

      - name: Refuse a tag that disagrees with MECHANISM_VERSION
        run: |
          python - <<'PY'
          import os, re, sys
          from microtensor.core.constants import MECHANISM_VERSION
          tag = os.environ["GITHUB_REF_NAME"]
          version = re.sub(r"^(?:[a-z]+-)?v", "", tag)
          if version != MECHANISM_VERSION:
              sys.exit(
                  f"tag {tag} claims {version} but MECHANISM_VERSION is {MECHANISM_VERSION}; "
                  "validators derive version_key from the constant, not the tag"
              )
          print(f"tag {tag} matches MECHANISM_VERSION {MECHANISM_VERSION}")
          PY

      - name: Build the wheel
        run: python -m build --wheel --sdist

      - name: Write and sign SHA256SUMS
        env:
          MT_RELEASE_SIGNING_SEED: ${{ secrets.MT_RELEASE_SIGNING_SEED }}
        run: python scripts/sign_release.py dist

      - name: The signature must verify the way a validator verifies it
        run: |
          python - <<'PY'
          # Through check_signature, not a lookalike: this has to prove the
          # code a validator actually runs accepts the release, or the failure
          # lands at install time on their machine instead of here.
          from pathlib import Path

          from microtensor.core.constants import RELEASE_SIGNING_KEY
          from microtensor.update.verify import check_signature

          assert RELEASE_SIGNING_KEY, "RELEASE_SIGNING_KEY is empty; nothing can verify this"

          ok, why = check_signature(
              Path("dist/SHA256SUMS").read_bytes(),
              Path("dist/SHA256SUMS.sig").read_bytes(),
              RELEASE_SIGNING_KEY,
          )
          assert ok, (
              f"a validator would reject this release: {why}. The seed in Actions "
              "secrets and the pinned public key are not a pair."
          )
          print(f"a validator verifies this release against {RELEASE_SIGNING_KEY}")
          PY

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/*.whl

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIVATION_BLOCK: ${{ vars.ACTIVATION_BLOCK }}
        run: |
          set -euo pipefail
          MECHANISM=$(python -c 'from microtensor.core.constants import MECHANISM_VERSION; print(MECHANISM_VERSION)')
          case "${GITHUB_REF_NAME}" in
            prerelease-*) CHANNEL=prerelease ;;
            *)              CHANNEL=stable ;;
          esac

          NOTES=$(mktemp)
          {
            echo "mechanism: ${MECHANISM}"
            if [ -n "${ACTIVATION_BLOCK:-}" ]; then
              echo "activation-block: ${ACTIVATION_BLOCK}"
            fi
            echo
            echo "Channel: ${CHANNEL}"
            echo
            echo "Verify before installing:"
            echo ""
            echo "    mt update check --channel ${CHANNEL}"
          } > "${NOTES}"

          gh release create "${GITHUB_REF_NAME}" \
            dist/*.whl dist/*.tar.gz dist/SHA256SUMS dist/SHA256SUMS.sig \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${NOTES}"
