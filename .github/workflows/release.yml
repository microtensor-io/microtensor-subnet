name: release

on:
  push:
    tags:
      - "v*.*.*"
      - "prerelease-v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install ".[validator,dev]" build

      - name: Nothing is published unless the checks pass
        run: |
          ruff check .
          mypy microtensor_subnet
          if [ -d tests ]; then
            pytest tests -q
          else
            echo "::warning::the suite is not published here; run it before tagging"
          fi
          python -c "import math; from microtensor_subnet.scoring.pools import POOL_SHARES; assert math.isclose(sum(POOL_SHARES.values()), 1.0)"

      - name: Refuse a tag that disagrees with MECHANISM_VERSION
        run: |
          python - <<'PY'
          import os, re, sys
          from microtensor_subnet.core.constants import MECHANISM_VERSION, RELEASE_VERSION
          tag = os.environ["GITHUB_REF_NAME"]
          version = re.sub(r"^(?:[a-z]+-)?v", "", tag)
          if version != RELEASE_VERSION:
              sys.exit(
                  f"tag {tag} claims {version} but RELEASE_VERSION is {RELEASE_VERSION}; "
                  "an updater compares the tag against that constant"
              )
          print(f"tag {tag} matches RELEASE_VERSION {RELEASE_VERSION}")
          print(f"mechanism stays {MECHANISM_VERSION}")
          PY

      - name: Refuse artifacts that disagree with the tag
        run: |
          python - <<'PY'
          # The wheel carried a version of its own once, and stayed at 0.1.0
          # while the tag and the constant moved. Every release then installed
          # over itself under the same version. Built here rather than trusted.
          import subprocess, sys
          from pathlib import Path

          from microtensor_subnet.core.constants import RELEASE_VERSION

          subprocess.run([sys.executable, "-m", "build", "--wheel"], check=True)
          built = sorted(Path("dist").glob("*.whl"))
          if not built:
              sys.exit("nothing was built")
          for wheel in built:
              version = wheel.name.split("-")[1]
              if version != RELEASE_VERSION:
                  sys.exit(
                      f"{wheel.name} packages {version} but RELEASE_VERSION is "
                      f"{RELEASE_VERSION}; pip would see a release that never moves"
                  )
              print(f"{wheel.name} packages {RELEASE_VERSION}")
          PY

      - name: Build the wheel
        run: python -m build --wheel --sdist

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018
        with:
          subject-path: dist/*.whl

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIVATION_BLOCK: ${{ vars.ACTIVATION_BLOCK }}
        run: |
          set -euo pipefail
          MECHANISM=$(python -c 'from microtensor_subnet.core.constants import MECHANISM_VERSION; print(MECHANISM_VERSION)')
          case "${GITHUB_REF_NAME}" in
            prerelease-*) CHANNEL=prerelease ;;
            *)              CHANNEL=stable ;;
          esac

          NOTES=$(mktemp)
          {
            echo "mechanism: ${MECHANISM}"
            if [ -n "${ACTIVATION_BLOCK:-}" ]; then
              echo "activation-block: ${ACTIVATION_BLOCK}"
            fi
            echo
            echo "Channel: ${CHANNEL}"
            echo
            echo "Verify a wheel before installing it:"
            echo ""
            echo "    gh attestation verify <wheel> -R ${GITHUB_REPOSITORY}"
          } > "${NOTES}"

          gh release create "${GITHUB_REF_NAME}" \
            dist/*.whl dist/*.tar.gz \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${NOTES}"
