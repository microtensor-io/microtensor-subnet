name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
        continue-on-error: true
      - run: mypy microtensor

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install ".[validator,dev]"
      - name: Run the suite with the sandbox enforced
        run: |
          if [ -d tests ]; then
            pytest tests -q
          else
            echo "::notice::the suite is not published in this repository; skipping"
          fi
      - name: Confirm the jail refuses to run unsandboxed on a POSIX host
        run: python -c "from microtensor.harness.limits import sandbox_available; assert sandbox_available()"
      - name: A round must settle end to end with no chain
        run: mt validator loopback --rounds 2 --miners 3

  mechanism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ".[validator,dev]"
      - name: Emission shares must sum to one
        run: python -c "from microtensor.core.tracks import validate_registry; validate_registry()"
      - name: The launch scope must be the one live competition
        run: |
          python - <<'PY'
          from microtensor.core.constants import CLASS_WEIGHTS
          from microtensor.core.tracks import competitions
          expected = [("code", "mt-3g")]
          assert competitions() == expected, competitions()
          assert sum(CLASS_WEIGHTS.values()) == 1.0, CLASS_WEIGHTS
          print(competitions())
          PY
      - name: A round must settle end to end with no chain
        run: mt validator loopback --rounds 3 --miners 4
      - name: The systems path must be the only path
        run: |
          python - <<'PY'
          import microtensor.core.constants as c
          assert not hasattr(c, "SYSTEMS_ENABLED"), "the migration flag must stay deleted"
          from microtensor.validator.settle import allocations
          import inspect
          assert "_frontier_allocation" in inspect.getsource(allocations)
          print("systems are the only scoring path")
          PY
      - name: A degenerate system must reduce to the single-artifact path
        run: |
          python - <<'PY'
          from microtensor.core.system import SystemManifest
          system = SystemManifest.single("sha256:only", "mt-3g", base_model="org/base@sha")
          assert system.degenerate
          assert system.components == (system.front,)
          assert system.fits_class("mt-3g") == (True, "")
          print("degenerate reduction holds")
          PY
      - name: A worker must hold its last vector when the coordinator is unreachable
        run: |
          python - <<'PY'
          from microtensor.validator.client import CoordinatorClient
          from microtensor.validator.coordinated import HELD, Mode, plan_round
          client = CoordinatorClient(
              base_url="http://127.0.0.1:9", hotkey="w0", retries=2, backoff=0.0, timeout=1
          )
          plan = plan_round(client)
          assert plan.mode is Mode.HOLD, "an outage must pause, not fragment"
          assert not plan.measures, "a holding worker must not measure"
          assert plan.reason == HELD
          print("coordinator outage holds the last settled vector")
          PY
      - name: A worker must refuse a settlement it cannot recompute
        run: |
          python - <<'PY'
          from microtensor.coordinator.collect import intake
          from microtensor.coordinator.report import CostBlock, QualityBlock, Report
          from microtensor.coordinator.settle import Entry, build
          from microtensor.validator.client import SettlementRejected, verify_settlement

          def report(w):
              return Report(
                  round_index=1, worker_hotkey=w, system_digest="sha256:s0",
                  quality=QualityBlock(0.6, 0.6, 0.6), resolve_rate=1.0,
                  cost=CostBlock(expected_ms=100.0), conforming=True,
              )

          reports = [report("w0"), report("w1"), report("w2")]
          catalogue = {"sha256:s0": Entry("sha256:s0", "m0", 7, "code", "mt-3g", 0.0, 0.0,
                                          rounds_observed=5)}
          result = intake({"sha256:s0": reports})
          settlement = build(1, config_hash="c", corpus_version="v",
                             reconciled=result.reconciled, catalogue=catalogue,
                             report_digests=[r.digest() for r in reports])
          payload = settlement.body()
          bodies = [r.body() for r in reports]
          verify_settlement(payload, bodies, catalogue)

          payload["weights"] = {"99": 1.0}
          try:
              verify_settlement(payload, bodies, catalogue)
          except SettlementRejected:
              print("forged weights refused")
          else:
              raise SystemExit("a worker accepted a settlement it did not recompute")
          PY
      - name: The coordinator must not import the measurement stack
        run: |
          python - <<'PY'
          import ast, pathlib
          banned = {"onnxruntime", "onnx", "psutil", "microtensor.harness"}
          for path in pathlib.Path("microtensor/coordinator").rglob("*.py"):
              tree = ast.parse(path.read_text(encoding="utf-8"))
              for node in ast.walk(tree):
                  names = []
                  if isinstance(node, ast.Import):
                      names = [a.name for a in node.names]
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      names = [node.module]
                  for name in names:
                      assert not any(
                          name == b or name.startswith(b + ".") for b in banned
                      ), f"{path} imports {name}; the coordinator measures nothing"
          print("coordinator carries no measurement dependency")
          PY
      - name: A coordinator host must refuse to run as a worker
        run: |
          python - <<'PY'
          import tempfile, pathlib
          from microtensor.core.role import COORDINATOR, WORKER, RoleConflict, claim, require
          home = pathlib.Path(tempfile.mkdtemp())
          claim(home, COORDINATOR)
          try:
              require(home, WORKER)
          except RoleConflict:
              print("mutual refusal holds")
          else:
              raise SystemExit("a coordinator home accepted a worker")
          PY
      - name: Exclusive hypervolume must equal leave-one-out
        run: |
          python - <<'PY'
          import random
          from microtensor.core.constants import HV_QUANT_C, HV_QUANT_Q
          from microtensor.scoring.frontier import Point, exclusive_hypervolume, hypervolume
          rng = random.Random(7)
          for _ in range(500):
              n = rng.randint(1, 9)
              cs = sorted(rng.sample(range(0, HV_QUANT_C, 37), n))
              qs = sorted(rng.sample(range(1, HV_QUANT_Q, 41), n))
              pts = [Point(f"s{i}", q, c) for i, (q, c) in enumerate(zip(qs, cs))]
              total = hypervolume(pts)
              expected = {
                  p.key: total - hypervolume([o for o in pts if o.key != p.key]) for p in pts
              }
              assert exclusive_hypervolume(pts) == expected, pts
          worked = [Point("p1", 100, 1000), Point("p2", 200, 3000), Point("p3", 300, 6000)]
          assert exclusive_hypervolume(worked) == {"p1": 200000, "p2": 300000, "p3": 400000}
          print("closed form agrees with leave-one-out on 500 frontiers")
          PY
      - name: An uploaded bundle must verify against its own hidden tests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          out = Path("/tmp/ci-corpus")
          out.mkdir(parents=True, exist_ok=True)
          tasks, tests = [], []
          for i in range(24):
              partition = "rotating" if i < 16 else "fixed"
              ref = f"code-ci-{i:03d}"
              tasks.append({
                  "ref": ref,
                  "prompt": f"Task {ref}: write fn_{i}(xs) returning xs plus {i * 3}.",
                  "gold": None,
                  "partition": partition,
                  "max_output_tokens": 128,
                  "inputs": {},
              })
              tests.append({
                  "ref": ref,
                  "entry_point": f"fn_{i}",
                  "tests": [
                      {"args": [[j]], "expected": j, "edge": j == 0} for j in range(6)
                  ],
              })
          (out / "code.jsonl").write_text(
              "\n".join(json.dumps(t) for t in tasks) + "\n", encoding="utf-8"
          )
          (out / "code.tests.jsonl").write_text(
              "\n".join(json.dumps(t) for t in tests) + "\n", encoding="utf-8"
          )
          PY
          mt corpus check /tmp/ci-corpus --tasks-per-round 12
      - name: The package must build and carry both neuron entrypoints
        run: |
          pip install build
          python -m build --wheel
          python - <<'PY'
          import zipfile, glob, sys
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          entry = next(n for n in names if n.endswith("entry_points.txt"))
          text = zipfile.ZipFile(whl).read(entry).decode()
          for script in ("mt =", "mt-validator =", "mt-miner ="):
              assert script in text, f"{script} missing from {entry}"
          assert any(n.startswith("neurons/") for n in names), "neurons package not packaged"
          print(text)
          PY

  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validator image builds
        run: docker build -f deploy/Dockerfile.validator -t microtensor/validator:ci .
      - name: Miner image builds
        run: docker build -f deploy/Dockerfile.miner -t microtensor/miner:ci .
