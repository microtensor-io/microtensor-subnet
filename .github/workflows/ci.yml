name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
        continue-on-error: true
      - run: mypy microtensor

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install ".[validator,dev]"
      - name: Run the suite
        run: |
          if [ -d tests ]; then
            pytest tests -q
          else
            echo "::notice::the suite is not published in this repository; skipping"
          fi
      - name: Every module imports
        run: |
          python - <<'PY'
          import importlib, pkgutil, microtensor
          skipped = []
          for info in pkgutil.walk_packages(microtensor.__path__, "microtensor."):
              try:
                  importlib.import_module(info.name)
              except ImportError as exc:
                  skipped.append(f"{info.name}: {exc}")
          print("\n".join(skipped) or "all modules import")
          PY

  mechanism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ".[validator,dev]"
      - name: The pool shares sum to one and the payout schedule is monotone
        run: |
          python - <<'PY'
          import math
          from microtensor.scoring.pools import POOL_SHARES, RANK_PAYOUT
          assert math.isclose(sum(POOL_SHARES.values()), 1.0), POOL_SHARES
          assert list(RANK_PAYOUT) == sorted(RANK_PAYOUT, reverse=True), RANK_PAYOUT
          print("pools ok")
          PY
      - name: The sandbox image installs exactly the allowed packages
        run: |
          python - <<'PY'
          from microtensor.artifact.contract import ALLOWED_PACKAGES
          for name, version in ALLOWED_PACKAGES.items():
              assert version.count(".") >= 1, f"{name} is not pinned"
          print(f"{len(ALLOWED_PACKAGES)} pinned packages")
          PY
      - name: The package must build and carry the entrypoints
        run: |
          pip install build
          python -m build --wheel
          python - <<'PY'
          import zipfile, glob
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          entry = next(n for n in names if n.endswith("entry_points.txt"))
          text = zipfile.ZipFile(whl).read(entry).decode()
          for script in ("mt =", "mt-validator =", "mt-operator ="):
              assert script in text, f"{script} missing from {entry}"
          assert any(n.startswith("neurons/") for n in names), "neurons package not packaged"
          print(text)
          PY

  gguf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ".[validator,gguf,huggingface,dev]"
      - name: Report what the build registers
        run: python -c "from microtensor.harness.registry import available, load_builtin; load_builtin(); print(sorted(str(f) for f in available()))"
      - name: The gguf engine must actually register
        run: |
          python - <<'PY'
          from microtensor.core.protocol import ArtifactFormat
          from microtensor.harness.registry import available, load_builtin

          load_builtin()
          registered = available()
          assert ArtifactFormat.GGUF in registered, (
              f"the gguf extra is installed but no engine registered: {registered}"
          )
          print("gguf registered")
          PY
      - name: Does llama.cpp reduce identically across thread counts
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          python - <<'PY'
          # THREADS = 1 is the single largest cost in the latency ceilings, and
          # relaxing it is only safe if more threads give the same answer. This
          # measures that rather than assuming it either way. Reported, not
          # enforced: a difference here is a finding about llama.cpp, not a
          # regression in this repository.
          from pathlib import Path

          from huggingface_hub import hf_hub_download, list_repo_files

          from microtensor.core.protocol import ArtifactFormat, LoadManifest
          from microtensor.harness.contract import Request
          from microtensor.harness.engines import gguf

          repo = "Qwen/Qwen3-0.6B-GGUF"
          names = [n for n in list_repo_files(repo) if n.lower().endswith(".gguf")]
          chosen = sorted([n for n in names if "q8_0" in n.lower()] or names, key=len)[0]
          weights = Path(hf_hub_download(repo_id=repo, filename=chosen))

          manifest = LoadManifest(
              format=ArtifactFormat.GGUF,
              quantization="q8_0",
              entrypoint=weights.name,
              max_input={"tokens": 256},
          )
          request = Request(task_ref="threads", prompt="2 + 2 =", max_output_tokens=24)

          answers = {}
          for threads in (1, 2, 4):
              engine = gguf.GgufEngine(threads=threads)
              engine.load(weights, manifest)
              try:
                  answers[threads] = engine.generate(request).output
              finally:
                  engine.unload()
              print(f"threads={threads}: {answers[threads]!r}")

          if len(set(answers.values())) == 1:
              print("::notice::llama.cpp agreed across 1, 2 and 4 threads on this host")
          else:
              print(
                  "::warning::llama.cpp disagreed across thread counts; the thread "
                  "pin stays at 1 and the latency ceilings stand as measured"
              )
          PY

      - name: The pinned llama.cpp must load every architecture we claim
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          python - <<'PY'
          from pathlib import Path

          from huggingface_hub import hf_hub_download, list_repo_files

          from microtensor.core.protocol import ArtifactFormat, LoadManifest
          from microtensor.harness.contract import Request
          from microtensor.harness.engines import gguf

          # The smallest published GGUF per architecture: the question is
          # whether the bundled llama.cpp knows the architecture at all, and a
          # 0.6B answers that as well as a 70B would.
          FIXTURES = {
              "qwen3": ("Qwen/Qwen3-0.6B-GGUF", "q8_0"),
              "qwen2": ("Qwen/Qwen2.5-0.5B-Instruct-GGUF", "q8_0"),
              "llama": ("unsloth/Llama-3.2-1B-Instruct-GGUF", "q4_k_m"),
              "gemma3": ("unsloth/gemma-3-270m-it-GGUF", "q8_0"),
              "qwen35": ("unsloth/Qwen3.5-0.8B-GGUF", "q8_0"),
          }
          UNTESTED = {"qwen3moe", "gemma2", "phi3"}

          uncovered = sorted(gguf.SUPPORTED_ARCHITECTURES - set(FIXTURES) - UNTESTED)
          assert not uncovered, (
              f"no fixture covers {uncovered}; add one here or drop the "
              "architecture from SUPPORTED_ARCHITECTURES"
          )

          def fetch(repo: str, quant: str) -> Path:
              names = [n for n in list_repo_files(repo) if n.lower().endswith(".gguf")]
              wanted = [n for n in names if quant in n.lower()]
              single = [n for n in (wanted or names) if "-00001-of-" not in n]
              chosen = sorted(single or names, key=len)[0]
              return Path(hf_hub_download(repo_id=repo, filename=chosen))

          for architecture, (repo, quant) in sorted(FIXTURES.items()):
              weights = fetch(repo, quant)

              declared = gguf.read_architecture(weights)
              assert declared == architecture, (
                  f"{repo} declares {declared!r}, expected {architecture!r}"
              )

              # The engine's own gate must pass a file it claims to run.
              gguf.validate_artifact(weights)

              manifest = LoadManifest(
                  format=ArtifactFormat.GGUF,
                  quantization=quant,
                  entrypoint=weights.name,
                  max_input={"tokens": 256},
              )
              engine = gguf.GgufEngine()
              engine.load(weights, manifest)
              try:
                  request = Request(
                      task_ref=f"arch-{architecture}",
                      prompt="2 + 2 =",
                      max_output_tokens=16,
                  )
                  first = engine.generate(request)
                  second = engine.generate(request)
              finally:
                  engine.unload()

              assert first.ok, f"{architecture}: {first.error}"
              assert first.output_tokens > 0, f"{architecture} produced nothing"
              # Determinism on a real model, not a mock: greedy at temperature
              # zero, one thread, fixed seed, so the same prompt must repeat.
              assert first.output == second.output, f"{architecture} did not repeat"

              print(f"{architecture:<8} {repo} loaded, ran and repeated")
          PY

  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validator image builds
        run: docker build -f deploy/Dockerfile.validator -t microtensor/validator:ci .
      - name: Sandbox image builds
        run: docker build -f deploy/Dockerfile.sandbox -t microtensor/sandbox:ci .
