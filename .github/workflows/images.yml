name: images

on:
  push:
    branches: [main]
    paths:
      - "deploy/v2/**"
      - "microtensor/**"
      - "pyproject.toml"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [sandbox, validator]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/v2/Dockerfile.${{ matrix.image }}
          push: true
          tags: |
            ghcr.io/microtensor-io/${{ matrix.image }}:1
            ghcr.io/microtensor-io/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
