[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "microtensor-subnet"
# Taken from RELEASE_VERSION rather than written twice, so the tag, the wheel
# and what an updater compares are one number. MECHANISM_VERSION is separate
# and moves only when the rules do.
dynamic = ["version"]
description = "Microtensor — a Bittensor subnet for compressing frontier models into hardware-constrained specialists under a verified deployment envelope."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    # Capped below 11 because the chain client is not adapted to it. bittensor
    # 11 dropped the flat Subtensor methods for lazily-constructed namespaces;
    # the metagraph read handles both, block reads and set_weights do not. The
    # ceiling was <12, so a fresh install resolved to 11.1.0 and every miner
    # hit AttributeError on the first block read. Raise this when the three
    # remaining call sites are adapted and verified against 11.
    "bittensor>=9.0.0,<11",
    # Declared rather than leaned on through bittensor: this is what checks a
    # release signature before auto-update runs the code, and a security check
    # should not rest on another package's dependency list.
    "cryptography>=42",
]

[project.optional-dependencies]
validator = [
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "tokenizers>=0.19",
    "numpy>=1.26",
    "psutil>=5.9",
    # Not optional while PROVENANCE_REQUIRED is on: a validator builds a run
    # store every round, so without wandb it raises before it measures
    # anything. Leaving it in the provenance extra meant the documented
    # install produced a validator that could not run a round.
    "wandb>=0.17",
]
# Exactly pinned, not floored: the wheel carries the llama.cpp build, and the
# build is where the numerics come from. A range here would let two validators
# disagree on quality for no reason a miner could act on.
#
# Moving this pin is a real change: the bundled llama.cpp decides which
# architectures load at all. 0.3.2 predated Qwen3 and answered every model on
# the allowlist with `unknown model architecture: 'qwen3'`. Run
# tests/test_gguf_architectures.py against a candidate before committing one.
gguf = [
    "llama-cpp-python==0.3.35",
]
coordinator = [
    "pynacl>=1.5",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
huggingface = ["huggingface-hub>=0.24"]
s3 = ["boto3>=1.34"]
provenance = ["wandb>=0.17"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "hypothesis>=6.100",
]

[project.scripts]
mt = "microtensor.cli.main:main"
mt-validator = "neurons.validator:run"
mt-miner = "neurons.miner:run"

[tool.setuptools.dynamic]
version = { attr = "microtensor.core.constants.RELEASE_VERSION" }

[tool.setuptools.packages.find]
include = ["microtensor*", "neurons*"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["build", "dist", ".venv", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "S"]
ignore = [
    "S101",  # assert is fine in tests
    "N818",  # exception names read better without the Error suffix here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "PLR2004"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "bittensor.*",
    "bittensor_wallet.*",
    "substrateinterface.*",
    "boto3.*",
    "botocore.*",
    "huggingface_hub.*",
    "llama_cpp.*",
    "onnx.*",
    "onnxruntime.*",
    "tokenizers.*",
    "torch.*",
    "psutil.*",
    "psutil.*",
    "numpy.*",
    "wandb.*",
    "nacl.*",
    "fastapi.*",
    "uvicorn.*",
]
ignore_missing_imports = true

# Opaque whether or not it is installed. ignore_missing_imports only applies
# when a module is absent, so mypy saw bittensor as Any on a developer machine
# without it and followed the real package in CI, and the two disagreed about
# which ignores were needed. bittensor also exposes much of its surface through
# a module __getattr__, so static checking of it is unreliable in any case.
# Skipping makes both environments agree instead of one of them being right by
# accident.
[[tool.mypy.overrides]]
module = [
    "bittensor",
    "bittensor.*",
    "bittensor_wallet",
    "bittensor_wallet.*",
]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["microtensor.coordinator.api"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
