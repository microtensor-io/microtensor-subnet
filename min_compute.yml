version: "0.1.0"
netuid: 92

miner:
  enforced: false
  rationale: >
    A miner compresses a frontier model into a specialist. That training run is
    the real cost and happens entirely off-subnet. Running the microtensor
    tooling itself needs almost nothing.

  training:
    gpu:
      recommended:
        - name: "NVIDIA RTX 4090"
          vram_gb: 24
        - name: "NVIDIA RTX 5090"
          vram_gb: 32
      minimum:
        - name: "NVIDIA RTX 3090"
          vram_gb: 24
      vendor: "NVIDIA only"
      vendor_reason: >
        bitsandbytes and unsloth require CUDA. AMD, Apple Silicon and Intel GPUs
        will not run the recommended compression stack.
    cpu_cores: 8
    ram_gb: 32
    disk_gb: 500
    disk_type: "SSD"

  toolchain:
    recommended:
      - name: "unsloth"
        why: "60-70% lower VRAM and 2-5x faster fine-tuning"
      - name: "bitsandbytes"
        why: "4-bit and 8-bit quantisation"

  subnet_tooling:
    cpu_cores: 2
    ram_gb: 4
    gpu: none
    disk_gb: 50
    note: "mt miner init | package | upload | publish | run"

  selfcheck_ram_gb_by_class:
    mt-16g: 20
    mt-4g: 6
    mt-3g: 5
    mt-1g: 3

  uptime:
    required: false
    note: >
      A miner comes online once per round, inside the submission window, long
      enough to send one extrinsic. The rest of the round belongs to training.

  unattended:
    command: "mt miner serve"
    note: >
      Trains and submits without anyone typing a command, reporting each epoch
      to the coordinator. Telemetry is observational: it never enters a
      certificate and never affects a score.
    network:
      public_ip: true
      port: 8091
      why: >
        The daemon answers on-demand status queries over an axon. Only needed
        for mt miner serve; the manual package, provenance, ship path needs no
        inbound port.
    liveness:
      heartbeat_blocks: 300
      note: >
        Silence past the heartbeat drops a miner that has not committed. A
        commitment on chain ends the check, because the artifact is already
        fetchable by any validator.

validator:
  enforced: true

  host:
    os: "Linux"
    os_reason: >
      The execution jail needs resource.setrlimit. `mt validator run` refuses to
      start where it is unavailable, and any run that slips through is flagged
      sandboxed=False and can never reach a weight vector.
    cpu_cores: 8
    ram_gb: 32
    disk_gb: 1000
    disk_max_gb: 2000
    disk_type: "NVMe"
    gpu: none
    gpu_reason: >
      The engine runs on CPUExecutionProvider. Validation is deliberately cheap
      so that validating is not a capital barrier.

  network:
    bandwidth_mbps: 1000
    monthly_transfer_gb_min: 500
    monthly_transfer_gb_max: 1000
    note: "Driven by artifact fetches; a full round pulls every submission."

  uptime:
    required: true
    note: >
      Runs a neuron continuously, one round every ROUND_BLOCKS. Missing the
      evaluation window means abstaining for that round.

  reference_bench:
    required: "one device for the launch class, mt-3g"
    classes:
      - id: "mt-3g"
        max_size_gb: 1.5
        max_rss_gb: 3
        max_p95_ms: 180
        reference: "developer workstation"
