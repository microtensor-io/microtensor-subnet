services:
  coordinator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.coordinator
    image: microtensor/coordinator:latest
    container_name: microtensor-coordinator
    restart: on-failure
    environment:
      MT_ROLE: coordinator
      MT_NETUID: "92"
      MT_NETWORK: finney
      MT_HOME: /var/lib/microtensor
    volumes:
      - coordinator-state:/var/lib/microtensor
      - ${HOME}/.bittensor/wallets:/root/.bittensor/wallets:ro
    ports:
      - "127.0.0.1:8443:8443"
    command: ["mt", "coordinator", "serve", "--host", "0.0.0.0", "--port", "8443"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8443/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  coordinator-state:
