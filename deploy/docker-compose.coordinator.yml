services:
  coordinator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.coordinator
    image: microtensor/coordinator:latest
    container_name: microtensor-coordinator
    restart: on-failure
    environment:
      MT_ROLE: coordinator
      MT_NETUID: "92"
      MT_NETWORK: finney
      MT_MIN_ROUNDS_OBSERVED: ${MT_MIN_ROUNDS_OBSERVED:-}
      MT_REFERENCE_COST_MS: ${MT_REFERENCE_COST_MS:-}
      MT_ALSO_ACCEPT_ROUNDS: ${MT_ALSO_ACCEPT_ROUNDS:-}
      MT_ALSO_ACCEPT_HOTKEYS: ${MT_ALSO_ACCEPT_HOTKEYS:-}
      MT_HOME: /var/lib/microtensor
      MT_WALLET_NAME: ${MT_WALLET_NAME:-microtensor}
      MT_WALLET_HOTKEY: ${MT_WALLET_HOTKEY:-micro}
      MT_SERVER_URL: ${MT_SERVER_URL:-}
      MT_SERVER_CREDENTIAL: ${MT_SERVER_CREDENTIAL:-}
    volumes:
      - coordinator-state:/var/lib/microtensor
      - ${MT_WALLET_PATH:-${HOME}}/.bittensor/wallets:/root/.bittensor/wallets:ro
      - ${MT_WALLET_PATH:-${HOME}}/.bittensor/wallets:/home/ubuntu/.bittensor/wallets:ro
    ports:
      - "127.0.0.1:8443:8443"
    command: ["serve", "--host", "0.0.0.0", "--port", "8443"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8443/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  coordinator-state:
    name: coordinator-state
