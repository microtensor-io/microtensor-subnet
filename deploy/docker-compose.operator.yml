services:
  operator:
    image: ${MT_AGENT_IMAGE:-ghcr.io/microtensor-io/validator@sha256:42a8f5575378fab7f40dd5c5137ad2734a50623ba077862e7669e256bc2d1ec4}
    container_name: microtensor-operator
    restart: unless-stopped
    stop_grace_period: 10m
    group_add:
      - "${DOCKER_GID:-999}"
    environment:
      MT_NETUID: "${MT_NETUID:-129}"
      MT_NETWORK: "${MT_NETWORK:-finney}"
      MT_WALLET_NAME: "${MT_WALLET_NAME:?set the coldkey wallet name}"
      MT_WALLET_HOTKEY: "${MT_WALLET_HOTKEY:?set the hotkey name}"
      MT_WALLET_PATH: /wallets
      MT_HOME: /var/lib/microtensor
      MT_GATEWAY_IMAGE: "${MT_AGENT_IMAGE:-ghcr.io/microtensor-io/validator@sha256:42a8f5575378fab7f40dd5c5137ad2734a50623ba077862e7669e256bc2d1ec4}"
      HF_HOME: /var/lib/microtensor/cache/hf
      HF_TOKEN: "${HF_TOKEN:-}"
      MT_SGLANG_IMAGE: "${MT_SGLANG_IMAGE:-}"
      MT_LLAMA_IMAGE: "${MT_LLAMA_IMAGE:-}"
      MT_ACCEPT_LICENCES: "${MT_ACCEPT_LICENCES:-}"
      MT_AUTO_UPDATE: "${MT_AUTO_UPDATE:-0}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/microtensor:/var/lib/microtensor
      - ${MT_WALLET_DIR:-~/.bittensor/wallets}:/wallets:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - operator
      - run
      - --auto
      - --gpus
      - "${MT_GPUS:-all}"
      - --gpu-gb
      - "${MT_GPU_GB:-0}"
      - --worker
      - "${MT_WORKER:-}"
      - --home
      - /var/lib/microtensor
      - --server
      - "${MT_SERVER_URL:-https://api.microtensor.cloud}"
      - --gateway
      - "${MT_GATEWAY_URL:-wss://api.microtensor.cloud/v1/operators/socket}"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
