services:
  validator:
    image: ${MT_VALIDATOR_IMAGE:-ghcr.io/microtensor-io/validator@sha256:091b435fedc29af7145554b33c59ff93234723a5f497943a65e08f6708980ff0}
    container_name: microtensor-validator
    restart: unless-stopped
    stop_grace_period: 1h
    group_add:
      - "${DOCKER_GID:-999}"
    environment:
      MT_NETUID: "${MT_NETUID:-129}"
      MT_NETWORK: "${MT_NETWORK:-finney}"
      MT_WALLET_NAME: "${MT_WALLET_NAME:?set the coldkey wallet name}"
      MT_WALLET_HOTKEY: "${MT_WALLET_HOTKEY:?set the hotkey name}"
      MT_WALLET_PATH: /wallets
      MT_HOME: /var/lib/microtensor
      MT_GATEWAY_IMAGE: "${MT_VALIDATOR_IMAGE:-ghcr.io/microtensor-io/validator@sha256:091b435fedc29af7145554b33c59ff93234723a5f497943a65e08f6708980ff0}"
      MT_SERVER_URL: "${MT_SERVER_URL:-https://api.microtensor.cloud}"
      MT_RELAY_URL: "${MT_RELAY_URL:-https://api.microtensor.cloud}"
      MT_GPUS: "${MT_GPUS:-0}"
      MT_SPOT_CHECK_GPUS: "${MT_SPOT_CHECK_GPUS:-}"
      MT_SLM_MEMORY_SHARE: "${MT_SLM_MEMORY_SHARE:-0}"
      MT_AUTO_UPDATE: "${MT_AUTO_UPDATE:-1}"
      HF_HOME: /var/lib/microtensor/cache/hf
      HF_HUB_DISABLE_XET: "${HF_HUB_DISABLE_XET:-}"
      HF_TOKEN: "${HF_TOKEN:-}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/microtensor:/var/lib/microtensor
      - ${MT_WALLET_DIR:-~/.bittensor/wallets}:/wallets:ro
    command:
      - epoch
      - loop
      - --home
      - /var/lib/microtensor
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
